services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - PLATONUS_API_URL=${PLATONUS_API_URL:-http://platonus-api:8001}
    volumes:
      - rag_storage:/app/storage
      - ./backend/data/admission_info.json:/app/backend/data/admission_info.json
      - ./backend/data/admission_info_kk.json:/app/backend/data/admission_info_kk.json
    ports:
      - "${API_PORT:-18000}:8000"
    depends_on:
      - postgresql
      - qdrant
      - redis

  platonus-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - PLATONUS_API_URL=
    volumes:
      - ./backend/data/admission_info.json:/app/backend/data/admission_info.json
      - ./backend/data/admission_info_kk.json:/app/backend/data/admission_info_kk.json
    ports:
      - "${PLATONUS_API_PORT:-18001}:8001"
    depends_on:
      - postgresql
    command:
      - uvicorn
      - backend.platonus_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    ports:
      - "${FRONTEND_PORT:-18030}:80"
    depends_on:
      - api

  telegram:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - PLATONUS_API_URL=${PLATONUS_API_URL:-http://platonus-api:8001}
    volumes:
      - ./backend/data/admission_info.json:/app/backend/data/admission_info.json
      - ./backend/data/admission_info_kk.json:/app/backend/data/admission_info_kk.json
    depends_on:
      - postgresql
    command:
      - python
      - -m
      - backend.telegram_service.polling

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - .env
    volumes:
      - rag_storage:/app/storage
      - ./backend/data/admission_info.json:/app/backend/data/admission_info.json
      - ./backend/data/admission_info_kk.json:/app/backend/data/admission_info_kk.json
    depends_on:
      - postgresql
      - redis

  postgresql:
    image: postgres:15
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    ports:
      - "${POSTGRES_PORT:-15432}:5432"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-16333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-16379}:6379"

volumes:
  rag_storage:
    name: academicquestionbot_rag_storage
  qdrant_data:
    name: academicquestionbot_qdrant_data
